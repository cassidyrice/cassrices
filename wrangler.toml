# Cloudflare Pages project for https://cassrices.com
# Static site in _site (assembled by GitHub Actions) plus Pages Functions in ./functions.
name = "cassrices"
pages_build_output_dir = "_site"
compatibility_date = "2026-09-24"

# Free-sample request form submissions (functions/api/sample-request.js).
[[kv_namespaces]]
binding = "SAMPLE_REQUESTS"
id = "376aced1bcc64852b3577532509b38c3"

# Emails Cass about each new request (workers/sample-alert; deploy that Worker first).
[[services]]
binding = "SAMPLE_ALERT"
service = "cassrices-sample-alert"
