name: Point cassrices.com at Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Detach old worker and point DNS at Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          zone="4ed8962b935c0a5da1f2692bcc2ea11d"
          def call(method, url, payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw=resp.read().decode()
                      body=json.loads(raw) if raw.strip() else {"success": True, "result": None}
                      print(method, url.split("/client/v4/")[-1], resp.status, body.get("success"), body.get("errors"))
                      return body
              except urllib.error.HTTPError as e:
                  detail=e.read().decode()[:600]
                  print(method, url.split("/client/v4/")[-1], e.code, detail)
                  return None
          for domain_id in (
              "f99f0eefc92c25cac2f7e32e80da3d5c35c4498f",
              "9d15b52eede453d5e6be713c6de720075ddf3e62",
          ):
              call("DELETE", f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/domains/{domain_id}")
          dns=call("GET", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records?per_page=100")
          for r in (dns or {}).get("result") or []:
              if r.get("type")=="AAAA" and r.get("name") in {"cassrices.com","www.cassrices.com"} and r.get("content")=="100::":
                  call("DELETE", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records/{r['id']}")
          for name in ("cassrices.com","www"):
              call("POST", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records",
                   {"type":"CNAME","name":name,"content":"cassrices.pages.dev","proxied":True})
          call("POST", f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache", {"purge_everything":True})
          domains=call("GET", f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/cassrices/domains")
          for r in (domains or {}).get("result") or []:
              print("pages-domain", r.get("name"), r.get("status"))
          PY
