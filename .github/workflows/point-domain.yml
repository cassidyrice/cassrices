name: Point cassrices.com at Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Find what owns the domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone=4ed8962b935c0a5da1f2692bcc2ea11d
          fetch() {
            code=$(curl -sS -o "$2" -w '%{http_code}' "$1" -H "$auth")
            echo "GET $3 -> HTTP $code"
          }
          fetch "https://api.cloudflare.com/client/v4/zones/${zone}/workers/routes" /tmp/routes.json routes
          fetch "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" /tmp/workers.json workers
          fetch "https://api.cloudflare.com/client/v4/zones/${zone}/custom_hostnames" /tmp/hostnames.json hostnames
          fetch "https://api.cloudflare.com/client/v4/zones/${zone}/dns_records/8b7cd75ccf91206e506b96348a17da27" /tmp/apex.json apex-record
          python3 - << 'PY'
          import json
          def show(path, label, keys):
              d=json.load(open(path))
              print(label, "success", d.get("success"), "errors", d.get("errors"))
              result=d.get("result")
              rows=result if isinstance(result, list) else ([result] if isinstance(result, dict) else [])
              for r in rows:
                  if not isinstance(r, dict):
                      print(label, r)
                      continue
                  print(label, {k:r.get(k) for k in keys if k in r})
          show("/tmp/routes.json","route",("id","pattern","script"))
          show("/tmp/workers.json","worker",("id","name"))
          show("/tmp/hostnames.json","hostname",("id","hostname","status","ssl","custom_origin_server"))
          show("/tmp/apex.json","apex",("id","type","name","content","proxied","meta","comment","tags"))
          PY
