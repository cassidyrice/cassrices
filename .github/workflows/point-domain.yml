name: Point cassrices.com at Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: List worker custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o /tmp/wdom.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "$auth")
          echo "GET workers/domains -> HTTP $code"
          python3 - << 'PY'
          import json
          d=json.load(open("/tmp/wdom.json"))
          print("success", d.get("success"), "errors", d.get("errors"))
          for r in d.get("result") or []:
              print("wdom", {k:r.get(k) for k in ("id","hostname","service","environment","zone_name")})
          PY
